[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flip-anything"
version = "0.2.0"
description = "Hardware observation and reproducible trial infrastructure for Flip Anything"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hardware = ["xarm-python-sdk>=1.17.1,<2", "pyorbbecsdk2>=2,<3", "numpy>=1.24,<3", "opencv-python>=4.8,<5"]

[project.scripts]
flip = "flip_anything.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
